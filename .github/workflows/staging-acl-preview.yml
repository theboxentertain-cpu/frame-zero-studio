name: MIZENZA staging ACL rollback-only rehearsal

on:
  push:
    branches:
      - security/staging-acl-rollback-preview-20261107
    paths:
      - ".github/scripts/staging_acl_preview.py"
      - ".github/workflows/staging-acl-preview.yml"
      - "drizzle/migrations/0007_revision_acl_hardening.sql"
      - "drizzle/migrations/0008_privileged_table_access_lockdown.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mizenza-staging-acl-preview
  cancel-in-progress: false

jobs:
  preview:
    name: Verify 0007–0008 staging DDL and mandatory rollback
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
    steps:
      - name: Checkout MIZENZA review branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Python driver
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PostgreSQL client
        run: python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<4"

      - name: Rehearse both migrations then prove rollback
        run: python .github/scripts/staging_acl_preview.py
